<svg xmlns="http://www.w3.org/2000/svg" width="960" height="504" aria-label="Benchmark: bugs caught by category, Reticle versus Playwright" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" viewBox="0 0 960 504"><rect width="960" height="504" fill="#15131f" rx="14"/><text x="28" y="40" fill="#f4f2ff" font-size="19" font-weight="700">Bugs caught, by category</text><rect width="10" height="10" x="746" y="30" fill="#8b7bff" rx="3"/><text x="762" y="39" fill="#9a93b8" font-size="12">Reticle</text><rect width="10" height="10" x="828" y="30" fill="#5b6273" rx="3"/><text x="844" y="39" fill="#9a93b8" font-size="12">Playwright</text><text x="28" y="63" fill="#9a93b8" font-size="13">88 regressions injected into one app. The 2 false-positive traps (not real bugs) are excluded.</text><rect width="196" height="38" x="28" y="78" fill="#8b7bff" opacity=".14" rx="8"/><text x="42" y="95" fill="#9a93b8" font-size="11" letter-spacing=".4">RETICLE</text><text x="42" y="110" fill="#f4f2ff" font-size="14" font-weight="700">86 / 86 caught</text><rect width="196" height="38" x="236" y="78" fill="#5b6273" opacity=".14" rx="8"/><text x="250" y="95" fill="#9a93b8" font-size="11" letter-spacing=".4">PLAYWRIGHT</text><text x="250" y="110" fill="#f4f2ff" font-size="14" font-weight="700">60 / 86 caught</text><rect width="240" height="38" x="444" y="78" fill="#8b7bff" opacity=".14" rx="8"/><text x="458" y="95" fill="#9a93b8" font-size="11" letter-spacing=".4">FALSE GREENS — BROKEN, REPORTED OK</text><text x="458" y="110" fill="#f4f2ff" font-size="14" font-weight="700">0 vs 26</text><text x="28" y="145" fill="#f4f2ff" font-size="13" font-weight="600">state</text><text x="28" y="160" fill="#9a93b8" font-size="11">UI shows a value that contradicts the app store</text><rect width="396" height="12" x="312" y="132" fill="#fff" opacity=".06" rx="6"/><rect width="396" height="12" x="312" y="132" fill="#8b7bff" rx="6"/><text x="932" y="143" fill="#f4f2ff" font-size="12" font-weight="700" text-anchor="end">8/8</text><rect width="396" height="12" x="312" y="148" fill="#fff" opacity=".06" rx="6"/><rect width="0" height="12" x="312" y="148" fill="#5b6273" rx="6"/><text x="932" y="159" fill="#9a93b8" font-size="12" text-anchor="end">0/8</text><text x="28" y="185" fill="#f4f2ff" font-size="13" font-weight="600">business-logic</text><text x="28" y="200" fill="#9a93b8" font-size="11">a never-rendered field is corrupted</text><rect width="396" height="12" x="312" y="172" fill="#fff" opacity=".06" rx="6"/><rect width="396" height="12" x="312" y="172" fill="#8b7bff" rx="6"/><text x="932" y="183" fill="#f4f2ff" font-size="12" font-weight="700" text-anchor="end">6/6</text><rect width="396" height="12" x="312" y="188" fill="#fff" opacity=".06" rx="6"/><rect width="0" height="12" x="312" y="188" fill="#5b6273" rx="6"/><text x="932" y="199" fill="#9a93b8" font-size="12" text-anchor="end">0/6</text><text x="28" y="225" fill="#f4f2ff" font-size="13" font-weight="600">signal</text><text x="28" y="240" fill="#9a93b8" font-size="11">the app&apos;s own success signal never fired</text><rect width="396" height="12" x="312" y="212" fill="#fff" opacity=".06" rx="6"/><rect width="396" height="12" x="312" y="212" fill="#8b7bff" rx="6"/><text x="932" y="223" fill="#f4f2ff" font-size="12" font-weight="700" text-anchor="end">4/4</text><rect width="396" height="12" x="312" y="228" fill="#fff" opacity=".06" rx="6"/><rect width="0" height="12" x="312" y="228" fill="#5b6273" rx="6"/><text x="932" y="239" fill="#9a93b8" font-size="12" text-anchor="end">0/4</text><text x="28" y="265" fill="#f4f2ff" font-size="13" font-weight="600">net-status</text><text x="28" y="280" fill="#9a93b8" font-size="11">a 4xx/5xx the catch block swallowed</text><rect width="396" height="12" x="312" y="252" fill="#fff" opacity=".06" rx="6"/><rect width="396" height="12" x="312" y="252" fill="#8b7bff" rx="6"/><text x="932" y="263" fill="#f4f2ff" font-size="12" font-weight="700" text-anchor="end">4/4</text><rect width="396" height="12" x="312" y="268" fill="#fff" opacity=".06" rx="6"/><rect width="99" height="12" x="312" y="268" fill="#5b6273" rx="6"/><text x="932" y="279" fill="#9a93b8" font-size="12" text-anchor="end">1/4</text><text x="28" y="305" fill="#f4f2ff" font-size="13" font-weight="600">streams</text><text x="28" y="320" fill="#9a93b8" font-size="11">an SSE / WebSocket frame anomaly</text><rect width="396" height="12" x="312" y="292" fill="#fff" opacity=".06" rx="6"/><rect width="396" height="12" x="312" y="292" fill="#8b7bff" rx="6"/><text x="932" y="303" fill="#f4f2ff" font-size="12" font-weight="700" text-anchor="end">3/3</text><rect width="396" height="12" x="312" y="308" fill="#fff" opacity=".06" rx="6"/><rect width="132" height="12" x="312" y="308" fill="#5b6273" rx="6"/><text x="932" y="319" fill="#9a93b8" font-size="12" text-anchor="end">1/3</text><text x="28" y="345" fill="#f4f2ff" font-size="13" font-weight="600">perf</text><text x="28" y="360" fill="#9a93b8" font-size="11">render storm — DOM identical, 60 commits/s</text><rect width="396" height="12" x="312" y="332" fill="#fff" opacity=".06" rx="6"/><rect width="396" height="12" x="312" y="332" fill="#8b7bff" rx="6"/><text x="932" y="343" fill="#f4f2ff" font-size="12" font-weight="700" text-anchor="end">3/3</text><rect width="396" height="12" x="312" y="348" fill="#fff" opacity=".06" rx="6"/><rect width="132" height="12" x="312" y="348" fill="#5b6273" rx="6"/><text x="932" y="359" fill="#9a93b8" font-size="12" text-anchor="end">1/3</text><text x="28" y="385" fill="#f4f2ff" font-size="13" font-weight="600">deep-dom</text><text x="28" y="400" fill="#9a93b8" font-size="11">a break deep in a subtree a snapshot elides</text><rect width="396" height="12" x="312" y="372" fill="#fff" opacity=".06" rx="6"/><rect width="396" height="12" x="312" y="372" fill="#8b7bff" rx="6"/><text x="932" y="383" fill="#f4f2ff" font-size="12" font-weight="700" text-anchor="end">3/3</text><rect width="396" height="12" x="312" y="388" fill="#fff" opacity=".06" rx="6"/><rect width="264" height="12" x="312" y="388" fill="#5b6273" rx="6"/><text x="932" y="399" fill="#9a93b8" font-size="12" text-anchor="end">2/3</text><line x1="28" x2="932" y1="430" y2="430" stroke="#fff" stroke-opacity=".08"/><text x="28" y="454" fill="#9a93b8" font-size="12">The other 13 categories (55 bugs — visual, DOM, console, storage, routing): both catch everything.</text><text x="28" y="472" fill="#9a93b8" font-size="12">The gap is entirely where the screen looks right.</text></svg>